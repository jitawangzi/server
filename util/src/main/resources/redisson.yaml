#Redisson配置
singleServerConfig:
  address: redis://test:6379
  password: 32SSDgSDFsa3dsdfgg
  clientName: null
  database: 1 #选择使用哪个数据库0~15
  idleConnectionTimeout: 10000 #如果当前连接池里的连接数量超过了最小空闲连接数，而同时有连接空闲时间超过了该数值，那么这些连接将会自动被关闭，并从连接池里去掉。时间单位是毫秒。 
  connectTimeout: 10000  #同任何节点建立连接时的等待超时。时间单位是毫秒。 
  timeout: 3000 #等待节点回复命令的时间。该时间从命令发送成功时开始计时。
  retryAttempts: 3
  retryInterval: 1500
  subscriptionsPerConnection: 5
  subscriptionConnectionMinimumIdleSize: 1
  subscriptionConnectionPoolSize: 50
  connectionMinimumIdleSize: 32
  connectionPoolSize: 64 #设置对于master节点的连接池中连接数
  dnsMonitoringInterval: 5000
  #dnsMonitoring: false

threads: 0
nettyThreads: 8
codec:
  class: "org.redisson.codec.JsonJacksonCodec"
transportMode: "NIO"