syntax = "proto3";
option java_package = "cn.game.protocol.protobuf";
//option optimize_for = LITE_RUNTIME;
package Protos;
import "BaseMsg.proto" ;
import "RewardMsg.proto" ;

//请求邮件列表。
message MailListRequest_12000001{

}

//邮件列表数据
message MailListResponse_12000002{
	repeated MailInfo mails  = 1;        //
}

//查看未读邮件
message MailSeeRequest_12000003{
	string  uid = 1 ;	//邮件id,如果是null表示一键读取所有未读邮件
}

//
message MailSeeResponse_12000004{
}


//领取邮件奖励
message MailReceiveRequest_12000005{
	string  uid = 1 ;	//邮件id,如果是null表示一键领取所有的附件奖励
}

//领取邮件奖励返回
message MailReceiveResponse_12000006{
	repeated RewardInfo rewards  = 1;        //
}

//删除邮件
message MailDeleteRequest_12000007{
	string uid = 1 ;	//邮件id,如果是null表示删除所有已读邮件
}

//删除邮件返回
message MailDeleteResponse_12000008{
}

// 单个邮件数据
message MailInfo{
	// 邮件类型，1: 系统自动发的邮件，多语言的，不直接发文本内容，发文本id  
		// 2 : 邮件类型， 手动发的，一般为英文版，直接发内容
	uint32 type = 10  ; 
	string uid = 1 ;			//邮件唯一id
	string sender = 2;			//发件人,  根据邮件类型来，可能是id
	string title = 3;  			//标题,  根据邮件类型来，可能是id
	string content = 4;  		//内容,  根据邮件类型来，可能是id
	uint32 time = 5;			//发送时间（时间戳，秒）
	uint32 expireTime = 6;		//过期时间（时间戳，秒）
	bool see = 7;				//是否查看过
	bool receive = 8;			//是否领取过附件奖励
	repeated GoodsInfo attachments = 9;	//附件奖励
	repeated string params = 11 ; 

}
