syntax = "proto3";
option java_package = "cn.game.protocol.protobuf";
//option optimize_for = LITE_RUNTIME;
package Protos;
import "BaseMsg.proto" ;
import "RewardMsg.proto" ;
// 英雄相关协议

//英雄升级
message HeroUpLevelRequest_16000001{
  string uid = 1; // 英雄唯一id
}

message HeroUpLevelResponse_16000002{
}

//英雄一键升级,自动升级到最高级。
message HeroUpLevelMaxRequest_16000021{
  string uid = 1; // 英雄唯一id
}

message HeroUpLevelMaxResponse_16000022{
	int32 level = 1; // 升到的等级
}

//批量英雄升级，能升级哪个升级哪个
message HeroUpLevelBatchRequest_16000023{
}

message HeroUpLevelBatchResponse_16000024{
	repeated HeroInfo heros = 1;	// 升级后的英雄等级数据，注意这里只取uid和等级数据。
}


//英雄合成,也就是升星，突破。当前品质下可以升星，星级升满之后进行突破，改变品质。
message HeroConflateRequest_16000003{
  string uid = 1; // 本体英雄唯一id
  // 被消耗的英雄唯一id,如果使用了万能耗材，万能耗材不用填写这个值
  repeated string consumedUid = 2;
}
// 合成返回,客户端这里自己把相关的英雄、万能耗材扣掉。
message HeroConflateResponse_16000004{
	HeroInfo hero = 1;	// 本体英雄，不删除，保留uid，只改变品质和星级。
}


//英雄上阵
message HeroBattleRequest_16000005{
  string uid = 1; // 英雄唯一id
  int32 pos = 2;   // 1- 5;
}

message HeroBattleResponse_16000006{

}


//英雄等级重置,返还升级材料
message HeroLevelResetRequest_16000007{
  string uid = 1; // 英雄唯一id
}

//客户端看看自己读表返还升级的材料
message HeroLevelResetResponse_16000008{

}


//英雄品质重置
message HeroQualityResetRequest_16000011{
  string uid = 1; // 英雄唯一id
}

message HeroQualityResetResponse_16000012{
	repeated ItemInfo items = 2;	// 返还的万能突破道具。
}


//请求免费英雄日租卡，这个只有在功能开启的时候请求一下，不能重复请求
message HeroFreeDayRentRequest_16000030{
}

message HeroFreeDayRentResponse_16000031{
	repeated HeroInfo heros = 1;	// 免费日租英雄
}

//选择某个英雄日租卡。
message HeroFreeDayRentChooseRequest_16000032{
	string uid = 1; // 日租卡英雄uid。
}

message HeroFreeDayRentChooseResponse_16000033{
}



//查看图鉴数据
message HeroIllustrationsListRequest_16000040{
}

message HeroIllustrationsListResponse_16000041{
	repeated int32 heroIds = 1; 	// 曾经拥有过，但是现在已经不在了的英雄id  Hero表id
	repeated HeroIllustrationsInfo heros  = 2;  // 图鉴领奖
}

// 可以领取图鉴奖励的英雄
message HeroIllustrationsInfo{
	int32 heroId = 1;			// Hero表id
	repeated int32 quality  = 2; // 品质对应的奖励，如果品质等于英雄的初始品质，则表示获得奖励，
	// 如果大于初始品质，则是突破到该品质的奖励
}

//一键领取英雄的图鉴奖励
message HeroIllustrationsRewardRequest_16000042{
}

message HeroIllustrationsRewardResponse_16000043{
	repeated RewardInfo reward = 2;	// 获得的奖励
}



