syntax = "proto3";
option java_package = "cn.game.protocol.protobuf";
//option optimize_for = LITE_RUNTIME;
package Protos;

import "RewardMsg.proto" ;
import "BaseMsg.proto" ;


// 查看某类任务数据,一般在任务功能开启时，客户端请求一下。
message QuestListRequest_20000001
{
	int32 type  = 1 ; 			// 任务类型， QuestTypeEnum 的id，日常，周常等。
}

// 任务数据
message QuestListResponse_20000002
{
	repeated QuestInfo quests = 1 ;  // 当前类型的任务数据
}

// 领取任务奖励
message QuestReceiveRequest_20000004
{
	repeated int32 ids = 1 ; 			// Quest表id，想要领取的任务id，如果是空表示一键领取所有能领取的任务
}

message QuestReceiveResponse_20000005
{
	repeated RewardInfo rewards = 1 ; 			// 获得的奖励
}

// 领取任务活跃积分奖励
message QuestReceiveActivePointRequest_20000008
{
	int32 type = 1;		// 任务类型 QuestTypeEnum的id,目前每日任务、每周任务、七日任务有这个积分奖励
	repeated int32 index = 2 ;  // 例如 5个奖励 ， 0-4，领哪个，也可以同时领多个
}

message QuestReceiveActivePointResponse_20000009
{
	repeated RewardInfo rewards = 1 ; 			// 获得的奖励
}

// 一组任务状态变化通知，一般是有任务可以领奖时，或者加入了新的任务，会推送这个协议
message QuestGroupPush_20100008
{
	int32 type = 1 ; 			// 哪种类型的任务有变化
}

// 单个任务状态变化通知，一般是任务有变化，或者加入/删除了任务等，会推送这个协议
message QuestPush_20200008
{
	UpdateType  type = 1; 		// 更新类型
	QuestInfo quest = 2 ;  // 具体变化的任务，如果是删除，只用到id
}

// 单个任务状态
message QuestInfo
{
	int32   id = 1 ; 			// 任务id,Quest表id
	int32   state = 2 ; 		// "任务状态,1:能看, 不能接，不能开始 2:可接 3:已接（进行中，未完成）
	// 4 条件完成(可交付/可领奖) 5 已交付(已领奖) 一般完成之后不删除的任务，有这个状态。
	repeated int32 finishCount = 3 ;  // 任务相关条件完成数量统计
}

// 某组/类型 任务
message QuestGroupInfo
{
	int32 group = 1;   	// QuestTypeEnum 的id，日常，周常等。
	repeated QuestInfo quests = 2 ;  // 当前类型的任务数据
}

// 带积分奖励的任务，奖励领取情况
message QuestGroupPointRewardInfo
{
	int32 group = 1;   	// QuestTypeEnum 的id，日常，周常等。
	repeated int32 index = 2 ;  // 已经领取过的奖励索引(一般是5个奖励，0 - 4 )
}


// 请求所有任务数据，一般在任务功能开启的时候请求一下。
message QuestListAllRequest_20000051
{
}

// 任务数据
message QuestListAllResponse_20000052
{
   repeated QuestGroupInfo questGroups = 1 ;  // 任务数据
}


//@NotUseStart
