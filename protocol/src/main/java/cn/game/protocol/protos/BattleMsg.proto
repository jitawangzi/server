message BattlePvPInfoRequest_13000117{
}
//获取大道争锋信息 响应
message BattlePvPInfoResponse_13000118{
	int32 num = 1; //今天已经挑战的次数
	int32 settlementDayTimer = 2; //今天结算时间戳
	int32 settlementSeasonTimer = 3; //当前赛季的结算时间戳
	int32 nextSeasonTimer = 4; //下一个赛季时间戳
	int32 buyNum = 5; //今日购买的挑战券次数
	map<int32, int32> secretscriptMap = 6; // 神通PVP 阵容 key  id; value 位置 1-5 0表示下阵
	int32 freeRefreshNum = 7; //今日 免费刷新次数
	int32 refreshNum = 8; //今日 付费刷新次数
	repeated SimplePlayerInfo targetList = 9; //之前刷出来的列表
	repeated int32 scoreList = 10;//之前刷出来的列表的目标的当前积分列表


}
