}

/*** 梦魇秘境更新buff***/
message BattleNightmareRealmBuffUpdateRequest_13000082{
	map<int32,int32> buffIds = 1;			//  使用的全部buff，如果是null表示放弃本次加成。key NightmareRealmBuff表id: value:等级
}
