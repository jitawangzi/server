syntax = "proto3";
option java_package = "cn.game.protocol.protobuf";
package Protos;
import "RewardMsg.proto" ;
// 章节关卡协议
// 开始关卡战斗请求
message BattleFieldStartRequest_13000001{
	uint32 type = 1; 	// 玩法类型，主线战役推图，日常挑战等。 1代表主线战役，2 道心磨砺 3心魔试炼   11 合成的主线战役12 每日挑战
	uint32 typeId = 2; // 玩法类型对应的配置表id。 根据上面的type不同可能是不同的表id，例如1、2、3是Battle表id， 11 、12 是HCBattle表id;

	uint32 fieldId = 3;	// BattleField关卡id，有的玩法可能包含多个关卡，做一下区分。不一定有。
}

// 开始关卡战斗返回
message BattleFieldStartResponse_13000002{
	PlayerBattleAttrs attrs = 1;
}

// 玩家战斗属性数据
message PlayerBattleAttrs{
	map<int32,int32> playerAttrs = 4 ;// 玩家的属性，可能包括装备、宝石、炼金、武器等等系统的属性。
	repeated HeroAttr heroAttrs = 1 ; // 上阵英雄属性
	map<int32,int32> dragonAttrs = 2 ; // 龙属性，一般是龙的基础属性，加上龙的技能属性
	map<int32,int32> wallAttrs = 3 ;// 城池属性
}

// 英雄属性数据
message HeroAttr{
	string heroUid = 1;
	map<int32,int32> heroAttrs = 2 ; // 英雄属性
}

// 结束关卡战斗请求
message BattleFieldEndRequest_13000003{
	uint32 killMonsterCount = 1;	// 击杀怪物（小怪+头目）数量
	uint32 killMonsterBossCount = 6;	// 击杀首领数量
	uint32 hpPercent = 2;	// 城池剩余血量百分比，如剩余40%血量，则为40
	bool win = 3;	        // 战斗是否成功，用血量百分比可能有误差。
	uint32 battleTime = 4;	        // 战斗时长（秒）
}

// 结束关卡战斗
message BattleFieldEndResponse_13000004{
	repeated RewardInfo rewards = 1;		// 获得的奖励
}

// 看广告并分享之后额外获得xx倍奖励
message BattleShareRequest_13000007{
}

// 看广告并分享之后额外获得xx倍奖励
message BattleShareResponse_13000008{
	repeated RewardInfo rewards = 1;		// 获得的奖励
}


//领取战役  首次胜利奖励	首次半血胜利奖励	首次无损胜利奖励,可以一次领多个战役的。
message BattleRewardRequest_13000022{
   repeated uint32 id = 1; 			// Battle表的id
   repeated uint32 index = 2; 			// 0、1、2   代表首次，半血、无损奖励

}
message BattleRewardResponse_13000023{
   repeated RewardInfo reward = 1;
}

//合成领取战役  首次胜利奖励	首次半血胜利奖励	首次无损胜利奖励,可以一次领多个战役的。
message HCBattleRewardRequest_13000027{
   repeated uint32 id = 1; 			// Battle表的id
   repeated uint32 index = 2; 			// 0、1、2   代表首次，半血、无损奖励

}
message HCBattleRewardResponse_13000028{
   repeated RewardInfo reward = 1;
}


//关卡扫荡
message BattleSweepRequest_13000024{
   uint32 id = 1; 			// Battle表的id
}
message BattleSweepResponse_13000025{
   repeated RewardInfo reward = 1;
}


// 合成关卡扫荡
message HCBattleSweepRequest_13000040{
   uint32 id = 1; 			// HCBattle表的id
}
message HCBattleSweepResponse_13000041{
   repeated RewardInfo reward = 1;
}




/*** 领取巡逻奖励 ***/
message BattlePatrolRewardRequest_13000044{
	bool isFast = 1; // true ：快速巡逻，直接领取固定时长收益。 false： 根据时长领取收益
	bool advertising = 2; // 看广告领取快速巡逻收益，只有是快速巡逻是这个值才有用。
}

message BattlePatrolRewardResponse_13000045{
	repeated RewardInfo rewards = 1;// 随机掉落的奖励
	int32 exp = 2;					// 增加的经验  --- 客户端需本地增加经验
	int32 gold = 3;					// 增加的金币 --- 客户端需本地增加金币
}

// 战役信息
message BattleInfo{
	int32 id = 1;	//Battle表的id
	uint32 hpPercent = 2;	// 打完剩余血量百分比，如剩余40%血量，则为40,可能用不到了
	repeated int32 rewardIndex = 3; // 0、1、2  。领过的章节宝箱
	bool finish = 4; // 这个战役是否通关了。
	uint32 battleTime = 5;	        // 战斗时长（秒），或者说是波数
}

// 巡逻/挂机  数据
message PatrolInfo{
	int32 rewardTime = 1;			// 最后一次领取巡逻奖励的时间(秒时间戳)
	int32 quickPatrolCount = 2;		// 快速巡逻次数，巡逻过的次数
	int32 adPatrolCount = 3;		// 看广告快速巡逻次数，巡逻过的次数
}

/*** 保存阵容 ***/
message BattleLineupRequest_13000048{
	int32 battleType = 1;			// 玩法类型，梦魇秘境  9
	LineupInfo lineup = 2;//  阵容数据
}
message BattleLineupResponse_13000049{
}


// ****************************************道心磨砺/心魔试炼********************************************
///*** 查看道心磨砺/心魔试炼数据 ***/
message BattleDaoHeartRequest_13000055{
	int32 type = 1;					// 2 道心 3 心魔
}

message BattleDaoHeartResponse_13000056{
	int32 completedId = 1;			//最新通关过的（Battle）表id
	int32 nextId = 2;				// 最新通关的下一关，尚未通关的 （Battle）表id
	repeated int32 randomBuff = 3;			// 每天不同的随机 增益或者减益buff， HeroBUFF表id
	int32 freeSweepRemaning = 4;      // 免费剩余扫荡次数。
	int32 paySweepRemaning = 5;      // 收费剩余扫荡次数。
}

/*** 扫荡道心磨砺/心魔试炼关卡 ***/
message BattleDaoHeartSweepRequest_13000060{
	int32 type = 1;					// 2 道心 3 心魔
	int32 id = 2;					// （Battle）表id
}
message BattleDaoHeartSweepResponse_13000061{
	repeated RewardInfo rewards = 1;//
}

/*** 一键扫荡道心磨砺/心魔试炼关卡 ***/
message BattleDaoHeartSweepBatchRequest_13000062{
	int32 type = 1;					// 2 道心 3 心魔
	int32 id = 2;					// （Battle）表id
	bool pay = 3;				// 是否直接使用付费次数。
}
message BattleDaoHeartSweepBatchResponse_13000063{
	repeated RewardInfo rewards = 1;//
}


/*** 查看道心磨砺/心魔试炼通关奖励领取情况 ***/
message BattleDaoHeartSweepRequest_13000064{
	int32 type = 1;					// 2 道心 3 心魔
}
message BattleDaoHeartSweepResponse_13000065{
	repeated int32 id = 2;					// 已经领取过通关奖励的关卡id， （Battle）表id
}

/*** 领取道心磨砺/心魔试炼关卡通关奖励 ***/
message BattleDaoHeartSweepRequest_13000066{
	int32 type = 1;					// 2 道心 3 心魔
	int32 id = 2;					// （Battle）表id
}
message BattleDaoHeartSweepResponse_13000067{
	repeated RewardInfo rewards = 1;//
}


// ****************************************梦魇秘境********************************************

/*** 请求梦魇秘境数据 ***/
message BattleNightmareRealmRequest_13000080{
}
message BattleNightmareRealmResponse_13000081{
	repeated LineupInfo lineups = 1;//  阵容数据
	repeated int32 randomBuff = 3;			// 每天不同的随机 增益或者减益buff， HeroBUFF表id
	int32 buffRefreshTimes = 4;  // 可用的buff刷新次数
	repeated int32 quickRewardId = 5;    // 领取过的快速奖励的Battle表id(Battle表ClearGameReward有值的)
	map<int32,int32> buffIds = 6;		//  选择使用的全部buff
	int32  startBattle = 8;			//  手动战斗的起始关卡 Battle表id
}

/*** 梦魇秘境更新buff***/
message BattleNightmareRealmBuffUpdateRequest_13000082{
	map<int32,int32> buffIds = 1;			//  使用的全部buff，如果是null表示放弃本次加成
}
message BattleNightmareRealmBuffUpdateResponse_13000083{
}

/*** 梦魇秘境快速战斗***/
message BattleNightmareRealmQuickRequest_13000084{
}
message BattleNightmareRealmQuickResponse_13000085{
	repeated RewardInfo rewards = 1;//
}


// ****************************************每日挑战********************************************

// 领取每日挑战活跃积分奖励
message BattleDayChallengeReceiveActivePointRequest_13000070
{
	int32 index = 1 ;  // 0-3，一共4个奖励，领哪个
}

message BattleDayChallengeReceiveActivePointResponse_13000071
{
	repeated RewardInfo rewards = 1 ; 			// 获得的奖励
}

message DayChallengeInfo{
   int32 battleTimes   = 1; //每日挑战，挑战过的次数。
   int32 battleId   = 2; //每日挑战，每天不同的Battle 表id。
   repeated int32 randomBuff = 3;			// 每天不同的随机 增益或者减益buff， HeroBUFF表id
   repeated int32 rewardIndex = 4;			// 已经领取过奖励箱子的索引， 如果4个箱子就是0 - 3 。
}

message LineupInfo{
	int32 seq = 1; 							// 阵容顺序，从0开始
	repeated string heroUid = 2;			// 英雄唯一id
}

//@NotUseStart

// 肉鸽刷新,每天前3次免费，第四次看广告。
message BattleRougeRefreshRequest_13000005{
}

// 肉鸽刷新
message BattleRougeRefreshResponse_13000006{
}


/*** 领取体力 ***/
message BattleStaminaRequest_13000050{
	int32 time = 1; //领取哪个时间的体力
}

message BattleStaminaResponse_13000051{
}

//@NotUseEnd


