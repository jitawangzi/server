//目标列表刷新 请求
message BattlePvPTargetListRequest_13000111{
	bool refreshFlag = 1;//true 进入玩法首次刷新
	bool  useCost  =2; //true 使用付费刷新 扣除资源; false 使用免费刷新
}

//目标列表刷新 响应
message BattlePvPTargetListResponse_13000112{
	repeated SimplePlayerInfo targetList = 1;//查询到的目标列表
	repeated int32 scoreList = 2;//查询到的目标的当前积分列表
	int32 freeRefreshNum = 3; //今日 免费刷新次数
	int32 refreshNum = 4; //今日 付费刷新次数

}

//开始战斗请求
message BattlePvPStartRequest_13000113{
	string targetId = 1; //要挑战的对手的ID  可能是NPC 也可能是玩家
}
//开始战斗响应
message BattlePvPStartResponse_13000114{
		PlayerBattleAttrs selfAttrs = 1;  //我自己的属性
		PlayerBattleAttrs targetAttrs = 2; //目标的属性 null 则为NPC
		BattleLineupInfo targetLineupInfo = 3; // 目标的阵容 null 则为NPC
	  BattleSecretscriptInfo targetSecretscriptInfo = 4; // 目标当前使用的秘术  null 则为NPC

}
//结算战斗请求
message BattlePvPEndRequest_13000115{
	uint32 killMonsterCount = 1;	// 击杀怪物（小怪+头目）数量
	uint32 killMonsterBossCount = 2;	// 击杀首领数量
	uint32 hpPercent = 3;	// 城池剩余血量百分比，如剩余40%血量，则为40
	bool win = 4;	        // 战斗是否成功，用血量百分比可能有误差。
	uint32 battleTime = 5;	        // 战斗时长（秒）
	uint32 damage = 6;	        // 战斗伤害，例如世界boss战斗需要这个数值。
	int32 endType = 7; 				  // 结算类型: 0 正常结算; 1 主动退出战斗; 2 扫荡结算
	string targetId = 8; 					//要挑战的对手的ID  可能是NPC 也可能是玩家

}
//结算战斗响应
message BattlePvPEndResponse_13000116{
	repeated RewardInfo rewards = 1;
	int32 selfScore = 2;//我的新积分
	int32 targetScore = 3; //对方的积分
}
