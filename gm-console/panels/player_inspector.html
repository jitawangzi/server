<!-- @gm-panel
{
  "id": "player_inspector",
  "title": "白盒数据透视与快照对比",
  "category": "通用工具",
  "audience": ["QA", "DEV"],
  "modules": ["player", "gm"],
  "tags": ["白盒数据", "模块透视", "快照", "Diff对比", "回滚"],
  "order": 2,
  "summary": "可视化浏览玩家所有内存模块状态树，支持关键字检索与跨步骤快照 Diff 对比（保存基线 -> 执行操作 -> 一键对比字段增减变化）。"
}
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>白盒数据透视与快照对比</title>
  <style>
    .pi-wrap { display: flex; flex-direction: column; gap: 14px; color: var(--text-main); }
    .pi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .pi-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--primary);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .pi-layout { display: grid; grid-template-columns: 230px 1fr; gap: 12px; }
    .pi-sidebar {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--surface-subtle);
      max-height: 460px;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pi-mod-btn {
      text-align: left;
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pi-mod-btn:hover { background: var(--card-bg); border-color: var(--border-color); }
    .pi-mod-btn.active {
      background: var(--selected-bg);
      color: var(--selected-text);
      border-color: var(--primary);
      font-weight: 700;
    }
    .pi-tree {
      background: var(--code-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      max-height: 460px;
      overflow: auto;
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
    }
    .pi-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    @media (max-width: 820px) { .pi-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="pi-wrap">
  <!-- 1. 快照保存与跨步对比栏 -->
  <div class="pi-card">
    <div class="pi-title">
      <span>📸 跨步骤快照保存与状态 Diff 对比</span>
      <div class="pi-row">
        <button class="btn btn-secondary" style="padding:5px 10px; font-size:0.8rem;" onclick="window.PlayerInspectorPanel.refreshAll()">🔄 刷新透视与快照列表</button>
      </div>
    </div>
    <div class="pi-row" style="margin-bottom:10px;">
      <label style="margin:0; font-size:0.82rem; color:var(--text-muted);">基线快照名:</label>
      <input id="piSnapName" type="text" value="before_test" style="width:160px;" />
      <button class="btn" style="padding:6px 12px; font-size:0.82rem;" onclick="window.PlayerInspectorPanel.saveSnapshot()">💾 存为基线快照</button>
      <button class="btn btn-secondary" style="padding:6px 12px; font-size:0.82rem;" onclick="window.PlayerInspectorPanel.diffWithCurrent()">🔍 与当前内存对比 Diff</button>
      <button class="btn btn-secondary" style="padding:6px 12px; font-size:0.82rem;" onclick="window.PlayerInspectorPanel.restoreSelectedBase()">⏪ 回滚到基线</button>
    </div>
    <div class="pi-row" style="margin-bottom:10px;">
      <label style="margin:0; font-size:0.82rem; color:var(--text-muted);">Base:</label>
      <select id="piBaseSelect" style="width:180px;"></select>
      <label style="margin:0; font-size:0.82rem; color:var(--text-muted);">Target:</label>
      <select id="piTargetSelect" style="width:180px;"></select>
      <input id="piDiffModules" type="text" placeholder="限定模块(可空, 逗号分隔)" style="width:200px;" />
      <button class="btn" style="padding:6px 12px; font-size:0.82rem;" onclick="window.PlayerInspectorPanel.runCustomDiff()">⚖️ 对比两个快照</button>
    </div>
    <div id="piDiffResult" style="font-size:0.82rem; color:var(--text-muted);">提示：先「存为基线快照」，去测试台或游戏客户端操作后，点「与当前内存对比 Diff」即可定位隐藏数值变动。</div>
  </div>

  <!-- 2. 白盒模块数据树浏览器 -->
  <div class="pi-card">
    <div class="pi-title">
      <span>🌲 玩家内存模块白盒数据树</span>
      <div class="pi-row">
        <input id="piKeyword" type="text" placeholder="按字段名 / 值关键字过滤..." style="width:220px;" oninput="window.PlayerInspectorPanel.renderModuleBody()" />
        <button class="btn btn-secondary" style="padding:5px 10px; font-size:0.8rem;" onclick="window.PlayerInspectorPanel.toggleViewMode()">🔀 切换树形/JSON</button>
      </div>
    </div>
    <div id="piSummaryBar" style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">等待加载玩家数据...</div>
    <div class="pi-layout">
      <div class="pi-sidebar" id="piModuleSidebar">
        <div style="color:var(--text-muted); font-size:0.8rem; padding:6px;">加载中...</div>
      </div>
      <div class="pi-tree" id="piModuleBody">
        请选择左侧模块查看实时内存状态
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const esc = (s) => window.GmConsole ? window.GmConsole.escapeHtml(s) : String(s == null ? '' : s);
  const toast = (m, l) => window.GmConsole && window.GmConsole.toast(m, l);

  const state = {
    modulesData: {},
    moduleNames: [],
    selectedModule: '',
    snapshots: [],
    viewMode: 'tree'
  };

  function flattenPairs(obj, prefix, out) {
    if (obj === null || obj === undefined || typeof obj !== 'object') {
      out.push({ path: prefix || '(root)', val: obj });
      return;
    }
    if (Array.isArray(obj)) {
      if (obj.length === 0) {
        out.push({ path: prefix || '(root)', val: [] });
        return;
      }
      for (let i = 0; i < obj.length; i++) {
        flattenPairs(obj[i], `${prefix}[${i}]`, out);
      }
      return;
    }
    const keys = Object.keys(obj);
    if (keys.length === 0) {
      out.push({ path: prefix || '(root)', val: {} });
      return;
    }
    for (const k of keys) {
      const next = prefix ? `${prefix}.${k}` : k;
      flattenPairs(obj[k], next, out);
    }
  }

  function renderDiffResult(res) {
    const el = document.getElementById('piDiffResult');
    if (!el) return;
    if (!res || !res.ok || !res.data) {
      el.innerHTML = `<div style="color:var(--danger-text);">对比失败: ${esc(res?.message || res?.summary || '未知错误')}</div>`;
      return;
    }
    const d = res.data;
    const diffs = d.diffs || [];
    if (diffs.length === 0) {
      el.innerHTML = `<div style="padding:8px 10px; background:var(--surface-subtle); border:1px solid var(--border-color); border-radius:6px;">✅ <b>${esc(d.baseSnapshot || d.base)}</b> 与 <b>${esc(d.targetSnapshot || d.target)}</b> 完全一致（共 0 项差异）。</div>`;
      return;
    }
    el.innerHTML = `
      <div style="margin-bottom:6px; color:var(--accent-text);">
        共发现 <b>${d.diffCount || diffs.length}</b> 处变更 (${esc(d.baseSnapshot || d.base)} → ${esc(d.targetSnapshot || d.target)}${d.truncated ? '，已截断前500条' : ''}):
      </div>
      <div style="max-height:240px; overflow:auto; border:1px solid var(--border-color); border-radius:6px;">
        <table style="width:100%; border-collapse:collapse; font-family:monospace; font-size:0.78rem;">
          <thead>
            <tr style="background:var(--surface-subtle); border-bottom:1px solid var(--border-color); text-align:left;">
              <th style="padding:6px 10px;">字段路径 (Path)</th>
              <th style="padding:6px 10px; color:var(--danger-text);">变更前 (Before)</th>
              <th style="padding:6px 10px; color:var(--success-text);">变更后 (After)</th>
            </tr>
          </thead>
          <tbody>
            ${diffs.map(item => `
              <tr style="border-bottom:1px solid var(--row-border);">
                <td style="padding:5px 10px; color:var(--accent-text);">${esc(item.path)}</td>
                <td style="padding:5px 10px; color:var(--danger-text);">${esc(JSON.stringify(item.before))}</td>
                <td style="padding:5px 10px; color:var(--success-text);">${esc(JSON.stringify(item.after))}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderSidebar() {
    const sb = document.getElementById('piModuleSidebar');
    if (!sb) return;
    if (state.moduleNames.length === 0) {
      sb.innerHTML = `<div style="color:var(--text-muted); font-size:0.8rem; padding:6px;">无可用模块（请确认已选在线玩家）</div>`;
      return;
    }
    sb.innerHTML = state.moduleNames.map(name => {
      const modVal = state.modulesData[name];
      const keyCount = modVal && typeof modVal === 'object' ? Object.keys(modVal).length : 0;
      const active = name === state.selectedModule ? 'active' : '';
      return `<button class="pi-mod-btn ${active}" onclick="window.PlayerInspectorPanel.selectModule('${esc(name)}')"><span>${esc(name)}</span><span style="font-size:0.72rem; color:var(--text-muted);">${keyCount}</span></button>`;
    }).join('');
  }

  function renderModuleBody() {
    const body = document.getElementById('piModuleBody');
    if (!body) return;
    const modName = state.selectedModule;
    if (!modName || state.modulesData[modName] === undefined) {
      body.innerHTML = `<div style="color:var(--text-muted);">请先选中在线玩家并选择左侧模块</div>`;
      return;
    }
    const rawVal = state.modulesData[modName];
    const kw = (document.getElementById('piKeyword')?.value || '').trim().toLowerCase();
    if (state.viewMode === 'json' && !kw) {
      body.innerHTML = `<pre style="margin:0; background:transparent; border:none; padding:0;">${esc(JSON.stringify(rawVal, null, 2))}</pre>`;
      return;
    }
    const pairs = [];
    flattenPairs(rawVal, '', pairs);
    const filtered = kw
      ? pairs.filter(p => p.path.toLowerCase().includes(kw) || JSON.stringify(p.val).toLowerCase().includes(kw))
      : pairs;
    if (filtered.length === 0) {
      body.innerHTML = `<div style="color:var(--text-muted);">未匹配到包含 "${esc(kw)}" 的字段</div>`;
      return;
    }
    const maxShow = 400;
    const sliced = filtered.slice(0, maxShow);
    body.innerHTML = `
      <div style="font-size:0.74rem; color:var(--text-muted); margin-bottom:6px;">
        模块 <b>${esc(modName)}</b> | 显示 ${sliced.length}/${filtered.length} 个叶子路径
      </div>
      <table style="width:100%; border-collapse:collapse; font-size:0.78rem;">
        <tbody>
          ${sliced.map(p => `
            <tr style="border-bottom:1px solid var(--row-border);">
              <td style="padding:4px 8px; color:var(--accent-text); width:46%; word-break:break-all;">${esc(p.path)}</td>
              <td style="padding:4px 8px; color:var(--code-text); word-break:break-all;">${esc(JSON.stringify(p.val))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function renderSnapshotSelectors() {
    const baseSel = document.getElementById('piBaseSelect');
    const targetSel = document.getElementById('piTargetSelect');
    if (!baseSel || !targetSel) return;
    const names = state.snapshots.map(s => s.snapshotName || s.name).filter(Boolean);
    baseSel.innerHTML = names.length
      ? names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')
      : `<option value="">-- 暂无快照 --</option>`;
    targetSel.innerHTML = `<option value="__CURRENT__">__CURRENT__ (当前实时内存)</option>`
      + names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  }

  async function refreshAll() {
    const pid = window.GmConsole ? window.GmConsole.getSelectedPlayerId() : 0;
    const summaryEl = document.getElementById('piSummaryBar');
    if (!pid || pid <= 0) {
      if (summaryEl) summaryEl.textContent = '请先在顶部选择调试玩家或点击「测试登录」。';
      state.modulesData = {};
      state.moduleNames = [];
      renderSidebar();
      renderModuleBody();
      return;
    }
    try {
      const [insRes, snapRes] = await Promise.all([
        window.GmConsole.inspectPlayer([], pid),
        window.GmConsole.listSnapshots(pid)
      ]);
      if (insRes && insRes.ok && insRes.data) {
        const mods = insRes.data.modules || {};
        state.modulesData = mods;
        state.moduleNames = Object.keys(mods).sort();
        if (!state.selectedModule || !mods[state.selectedModule]) {
          state.selectedModule = state.moduleNames[0] || '';
        }
        if (summaryEl) {
          summaryEl.textContent = `玩家 ${pid} (${insRes.data.playerName || ''}) Lv.${insRes.data.level || 0} | 共加载 ${state.moduleNames.length} 个内存模块`;
        }
      } else if (summaryEl) {
        summaryEl.textContent = `加载玩家透视失败: ${insRes?.message || insRes?.summary || '未知错误'}`;
      }
      if (snapRes && snapRes.ok && snapRes.data && Array.isArray(snapRes.data.snapshots)) {
        state.snapshots = snapRes.data.snapshots;
      } else {
        state.snapshots = [];
      }
      renderSidebar();
      renderModuleBody();
      renderSnapshotSelectors();
    } catch (e) {
      if (summaryEl) summaryEl.textContent = '加载异常: ' + e.message;
    }
  }

  window.PlayerInspectorPanel = {
    refreshAll,
    renderModuleBody,
    selectModule: function (name) {
      state.selectedModule = name;
      renderSidebar();
      renderModuleBody();
    },
    toggleViewMode: function () {
      state.viewMode = state.viewMode === 'tree' ? 'json' : 'tree';
      renderModuleBody();
    },
    saveSnapshot: async function () {
      const name = (document.getElementById('piSnapName')?.value || '').trim() || 'before_test';
      const res = await window.GmConsole.saveSnapshot(name);
      toast(res.ok ? `已保存快照 [${name}]` : `保存失败: ${res.message || ''}`, res.ok ? 'ok' : 'error');
      await refreshAll();
      const baseSel = document.getElementById('piBaseSelect');
      if (baseSel) baseSel.value = name;
    },
    diffWithCurrent: async function () {
      const name = (document.getElementById('piSnapName')?.value || '').trim() || 'before_test';
      const mods = (document.getElementById('piDiffModules')?.value || '').trim();
      const res = await window.GmConsole.diffSnapshots(name, '__CURRENT__', mods);
      renderDiffResult(res);
    },
    runCustomDiff: async function () {
      const base = document.getElementById('piBaseSelect')?.value || '';
      const target = document.getElementById('piTargetSelect')?.value || '__CURRENT__';
      const mods = (document.getElementById('piDiffModules')?.value || '').trim();
      if (!base) {
        toast('请先保存至少一个快照作为 Base', 'warn');
        return;
      }
      const res = await window.GmConsole.diffSnapshots(base, target, mods);
      renderDiffResult(res);
    },
    restoreSelectedBase: async function () {
      const base = document.getElementById('piBaseSelect')?.value || (document.getElementById('piSnapName')?.value || '').trim();
      if (!base) {
        toast('请先选择要回滚的快照名', 'warn');
        return;
      }
      const res = await window.GmConsole.restoreSnapshot(base);
      toast(res.ok ? `已回滚至快照 [${base}]` : `回滚失败: ${res.message || ''}`, res.ok ? 'ok' : 'error');
      await refreshAll();
    }
  };

  const unsub = window.GmConsole ? window.GmConsole.onPlayerChange(() => refreshAll()) : null;
  window.__gmPanelCleanup = function () {
    if (typeof unsub === 'function') unsub();
  };
  refreshAll();
})();
</script>
</body>
</html>
