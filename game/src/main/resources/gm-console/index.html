<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameServer GM Console</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 40px;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .server-info { display: flex; align-items: center; gap: 12px; font-size: 0.875rem; }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .badge-dev { background-color: #0369a1; color: #e0f2fe; }
    .badge-prod { background-color: #b91c1c; color: #fee2e2; }
    .badge-clock { background-color: #047857; color: #d1fae5; }
    
    .clock-bar {
      background-color: #172554;
      border-bottom: 1px solid #1e3a8a;
      padding: 8px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.875rem;
    }
    .clock-item { display: flex; align-items: center; gap: 6px; }
    .clock-value { font-weight: 600; color: #67e8f9; font-family: monospace; }
    
    .nav-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 24px 0 24px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-color);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    
    .btn {
      background-color: var(--primary);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #475569; color: #fff; }
    .btn-secondary:hover { background-color: #64748b; }
    .btn-danger { background-color: var(--danger); color: #fff; }
    .btn-danger:hover { background-color: #dc2626; }
    
    pre {
      background-color: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      overflow-x: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      max-height: 400px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡</span> GameServer GM Console
    </div>
    <div class="server-info">
      <div>Server: <span id="lblServerId" class="clock-value">loading...</span></div>
      <div>Mode: <span id="lblRunMode" class="badge badge-dev">DEV</span></div>
      <div style="display:flex; align-items:center; gap:6px;">
        <label style="margin:0; font-size:0.8rem;">Token:</label>
        <input type="password" id="txtToken" placeholder="Ops Token" style="width:140px; padding:4px 8px; font-size:0.8rem;" />
        <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="saveToken()">Save</button>
      </div>
    </div>
  </header>

  <div class="clock-bar">
    <div class="clock-item">
      <span>虚拟时间:</span>
      <span id="lblVirtualTime" class="clock-value">--</span>
    </div>
    <div class="clock-item">
      <span>物理时间:</span>
      <span id="lblPhysicalTime" class="clock-value" style="color:var(--text-muted)">--</span>
    </div>
    <div class="clock-item">
      <span>偏移量:</span>
      <span id="lblOffset" class="badge badge-clock">0ms</span>
    </div>
    <div class="clock-item">
      <span>周期:</span>
      <span>D: <b id="lblDay" style="color:#67e8f9">--</b> | W: <b id="lblWeek" style="color:#67e8f9">--</b> | M: <b id="lblMonth" style="color:#67e8f9">--</b></span>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" onclick="quickOffset('+1h')">+1小时</button>
      <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" onclick="quickOffset('+1d')">+1天</button>
      <button class="btn btn-danger" style="padding:2px 8px; font-size:0.75rem;" onclick="resetClock()">归零</button>
      <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" onclick="refreshBootstrap()">🔄 刷新</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('tabSchema')">Schema 动态表单</button>
    <button class="tab-btn" onclick="switchTab('tabCommand')">命令行执行器</button>
    <button class="tab-btn" onclick="switchTab('tabClock')">虚拟时钟运维</button>
    <button class="tab-btn" onclick="switchTab('tabPanels')">自定义热载面板</button>
  </div>

  <div class="container">
    <!-- Tab 1: Schema 表单 -->
    <div id="tabSchema" class="tab-content active">
      <div class="grid">
        <div class="card">
          <div class="card-title">指令选择与参数</div>
          <div class="form-group">
            <label>指令分组 (Group):</label>
            <select id="selGroup" onchange="onGroupChange()"></select>
          </div>
          <div class="form-group">
            <label>GM 指令 (Action):</label>
            <select id="selAction" onchange="onActionChange()"></select>
          </div>
          <div id="lblActionDesc" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:14px;"></div>
          <div class="form-group">
            <label>目标玩家 ID (0 表示非玩家或当前玩家):</label>
            <input type="number" id="txtPlayerId" value="0" />
          </div>
          <div class="form-group" style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="chkDryRun" style="width:auto;" />
            <label for="chkDryRun" style="margin:0; cursor:pointer;">DryRun (预演不落库)</label>
          </div>
          <div id="dynamicParams"></div>
          <button class="btn" onclick="executeSchemaAction()" style="width:100%; justify-content:center; margin-top:12px;">执行指令</button>
        </div>
        <div class="card">
          <div class="card-title">执行响应结果</div>
          <pre id="preSchemaResult">等待执行...</pre>
        </div>
      </div>
    </div>

    <!-- Tab 2: 命令行 -->
    <div id="tabCommand" class="tab-content">
      <div class="card">
        <div class="card-title">文本命令执行</div>
        <div class="form-group">
          <label>命令字符串 (例如: time.status, time.offset +1d, item 1001 10):</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="txtCommand" placeholder="输入GM命令..." onkeydown="if(event.key==='Enter') executeTextCommand();" />
            <button class="btn" onclick="executeTextCommand()">发送</button>
          </div>
        </div>
        <pre id="preCommandResult">等待执行...</pre>
      </div>
    </div>

    <!-- Tab 3: 虚拟时钟 -->
    <div id="tabClock" class="tab-content">
      <div class="card">
        <div class="card-title">虚拟时钟跨周期结算运维</div>
        <div class="grid">
          <div>
            <div class="form-group">
              <label>相对偏移表达式 (如 +1d, -2h, 30m, 3600s):</label>
              <input type="text" id="txtOffsetExpr" value="+1d" />
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="chkOffsetBackward" style="width:auto;" />
              <label for="chkOffsetBackward" style="margin:0;">允许倒退 (allowBackward)</label>
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="chkOffsetKick" style="width:auto;" />
              <label for="chkOffsetKick" style="margin:0;">踢出在线玩家 (kickClients)</label>
            </div>
            <button class="btn" onclick="applyClockOffset()">应用偏移</button>
          </div>
          <div>
            <div class="form-group">
              <label>绝对目标时间 (格式: yyyy-MM-dd HH:mm:ss):</label>
              <input type="text" id="txtTargetTime" placeholder="2026-11-20 00:00:00" />
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="chkSetBackward" style="width:auto;" />
              <label for="chkSetBackward" style="margin:0;">允许倒退 (allowBackward)</label>
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="chkSetKick" style="width:auto;" />
              <label for="chkSetKick" style="margin:0;">踢出在线玩家 (kickClients)</label>
            </div>
            <button class="btn" onclick="setClockExact()">设置指定时间</button>
          </div>
        </div>
        <pre id="preClockResult" style="margin-top:16px;">时钟就绪</pre>
      </div>
    </div>

    <!-- Tab 4: 自定义面板 -->
    <div id="tabPanels" class="tab-content">
      <div class="card">
        <div class="card-title">
          <span>自定义 HTML 面板 (动态热重载)</span>
          <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="loadPanelsList()">刷新面板列表</button>
        </div>
        <div class="form-group">
          <label>选择面板:</label>
          <select id="selPanel" onchange="renderSelectedPanel()"></select>
        </div>
        <div id="panelContainer" style="min-height:300px; border:1px solid var(--border-color); border-radius:6px; padding:16px; background:#0f172a;">
          请选择自定义面板
        </div>
      </div>
    </div>
  </div>

  <script>
    let bootstrapData = null;
    let token = localStorage.getItem("gm_token") || "";
    document.getElementById("txtToken").value = token;

    function saveToken() {
      token = document.getElementById("txtToken").value.trim();
      localStorage.setItem("gm_token", token);
      alert("Token已保存");
      refreshBootstrap();
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      event.target.classList.add("active");
      document.getElementById(tabId).classList.add("active");
    }

    async function apiRequest(url, method = "GET", body = null) {
      const headers = { "Content-Type": "application/json" };
      if (token) {
        headers["X-GM-Token"] = token;
      }
      const opts = { method, headers };
      if (body) {
        opts.body = JSON.stringify(body);
      }
      const resp = await fetch(url, opts);
      const text = await resp.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        return { ok: false, message: text, statusCode: resp.status };
      }
    }

    async function refreshBootstrap() {
      const res = await apiRequest("/gm-console/api/bootstrap");
      if (!res.ok) {
        alert("获取控制台配置失败: " + (res.message || "401未授权"));
        return;
      }
      bootstrapData = res.data;
      document.getElementById("lblServerId").textContent = bootstrapData.serverId || "N/A";
      const runModeEl = document.getElementById("lblRunMode");
      runModeEl.textContent = bootstrapData.runMode || "DEV";
      runModeEl.className = "badge " + (bootstrapData.production ? "badge-prod" : "badge-dev");

      updateClockDisplay(bootstrapData.virtualClock);
      initSchemaDropdowns(bootstrapData.schema);
      initPanelsDropdown(bootstrapData.panels);
    }

    function updateClockDisplay(clock) {
      if (!clock) return;
      document.getElementById("lblVirtualTime").textContent = clock.virtualTime || "--";
      document.getElementById("lblPhysicalTime").textContent = clock.physicalTime || "--";
      document.getElementById("lblOffset").textContent = (clock.offsetMillis >= 0 ? "+" : "") + clock.offsetMillis + "ms";
      document.getElementById("lblDay").textContent = clock.day || "--";
      document.getElementById("lblWeek").textContent = clock.week || "--";
      document.getElementById("lblMonth").textContent = clock.month || "--";
    }

    function initSchemaDropdowns(schema) {
      if (!schema || !schema.actions) return;
      const groups = new Set();
      schema.actions.forEach(a => { if (a.group) groups.add(a.group); });
      const selGroup = document.getElementById("selGroup");
      selGroup.innerHTML = "<option value=''>-- 全部分组 --</option>";
      groups.forEach(g => {
        selGroup.innerHTML += `<option value="${g}">${g}</option>`;
      });
      onGroupChange();
    }

    function onGroupChange() {
      if (!bootstrapData || !bootstrapData.schema) return;
      const group = document.getElementById("selGroup").value;
      const actions = bootstrapData.schema.actions.filter(a => !group || a.group === group);
      const selAction = document.getElementById("selAction");
      selAction.innerHTML = "";
      actions.forEach(a => {
        selAction.innerHTML += `<option value="${a.id}">${a.id} - ${a.description || ""}</option>`;
      });
      onActionChange();
    }

    function onActionChange() {
      if (!bootstrapData || !bootstrapData.schema) return;
      const actionId = document.getElementById("selAction").value;
      const action = bootstrapData.schema.actions.find(a => a.id === actionId);
      const container = document.getElementById("dynamicParams");
      container.innerHTML = "";
      if (!action) return;

      document.getElementById("lblActionDesc").textContent = action.description || "";
      if (action.parameters && action.parameters.length > 0) {
        action.parameters.forEach(p => {
          const div = document.createElement("div");
          div.className = "form-group";
          div.innerHTML = `
            <label>${p.name} ${p.required ? "<b style='color:red'>*</b>" : ""} (${p.type}): <span style="color:#64748b">${p.description || ""}</span></label>
            <input type="${p.type === "int" || p.type === "long" ? "number" : "text"}" id="param_${p.name}" value="${p.defaultValue || ""}" placeholder="${p.name}" />
          `;
          container.appendChild(div);
        });
      }
    }

    async function executeSchemaAction() {
      const actionId = document.getElementById("selAction").value;
      const playerId = parseInt(document.getElementById("txtPlayerId").value) || 0;
      const dryRun = document.getElementById("chkDryRun").checked;
      const action = bootstrapData.schema.actions.find(a => a.id === actionId);
      const args = {};
      if (action && action.parameters) {
        action.parameters.forEach(p => {
          const el = document.getElementById("param_" + p.name);
          if (el && el.value !== "") {
            let val = el.value;
            if (p.type === "int" || p.type === "long") val = Number(val);
            else if (p.type === "boolean") val = (val === "true");
            args[p.name] = val;
          }
        });
      }
      const res = await apiRequest("/gm-console/api/execute", "POST", { action: actionId, playerId, args, dryRun });
      document.getElementById("preSchemaResult").textContent = JSON.stringify(res, null, 2);
      if (res.ok && (actionId.startsWith("time.") || actionId.startsWith("player.time."))) {
        refreshBootstrap();
      }
    }

    async function executeTextCommand() {
      const cmd = document.getElementById("txtCommand").value.trim();
      if (!cmd) return;
      const res = await apiRequest("/gm-console/api/execute", "POST", { cmd, playerId: 0 });
      document.getElementById("preCommandResult").textContent = JSON.stringify(res, null, 2);
      if (res.ok && cmd.startsWith("time")) {
        refreshBootstrap();
      }
    }

    async function quickOffset(expr) {
      const res = await apiRequest("/gm-console/api/execute", "POST", { action: "time.offset", args: { offset: expr } });
      refreshBootstrap();
    }

    async function resetClock() {
      if (!confirm("确定将虚拟时钟归零重置回物理时钟？")) return;
      const res = await apiRequest("/gm-console/api/execute", "POST", { action: "time.reset", args: { allowBackward: true } });
      refreshBootstrap();
    }

    async function applyClockOffset() {
      const offset = document.getElementById("txtOffsetExpr").value.trim();
      const allowBackward = document.getElementById("chkOffsetBackward").checked;
      const kickClients = document.getElementById("chkOffsetKick").checked;
      const res = await apiRequest("/gm-console/api/execute", "POST", { action: "time.offset", args: { offset, allowBackward, kickClients } });
      document.getElementById("preClockResult").textContent = JSON.stringify(res, null, 2);
      refreshBootstrap();
    }

    async function setClockExact() {
      const targetTime = document.getElementById("txtTargetTime").value.trim();
      const allowBackward = document.getElementById("chkSetBackward").checked;
      const kickClients = document.getElementById("chkSetKick").checked;
      const res = await apiRequest("/gm-console/api/execute", "POST", { action: "time.set", args: { targetTime, allowBackward, kickClients } });
      document.getElementById("preClockResult").textContent = JSON.stringify(res, null, 2);
      refreshBootstrap();
    }

    function initPanelsDropdown(panels) {
      const sel = document.getElementById("selPanel");
      sel.innerHTML = "<option value=''>-- 选择自定义面板 --</option>";
      if (panels && panels.length > 0) {
        panels.forEach(p => {
          sel.innerHTML += `<option value="${p.file}">${p.name} (${p.file})</option>`;
        });
      }
    }

    async function loadPanelsList() {
      const res = await apiRequest("/gm-console/api/panels");
      if (res.ok) {
        initPanelsDropdown(res.data);
      }
    }

    async function renderSelectedPanel() {
      const file = document.getElementById("selPanel").value;
      const container = document.getElementById("panelContainer");
      if (!file) {
        container.innerHTML = "请选择自定义面板";
        return;
      }
      const headers = {};
      if (token) headers["X-GM-Token"] = token;
      const resp = await fetch("/gm-console/panels/" + file, { headers });
      if (resp.ok) {
        container.innerHTML = await resp.text();
        const scripts = container.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      } else {
        container.innerHTML = `<span style='color:red'>加载面板失败 (HTTP ${resp.status}): ${await resp.text()}</span>`;
      }
    }

    // Window GM Console SDK
    window.GmConsole = {
      executeAction: (action, args = {}, playerId = 0) => apiRequest("/gm-console/api/execute", "POST", { action, args, playerId }),
      executeCmd: (cmd, playerId = 0) => apiRequest("/gm-console/api/execute", "POST", { cmd, playerId }),
      getBootstrap: () => bootstrapData
    };

    window.onload = refreshBootstrap;
  </script>
</body>
</html>
